<body>
<div id="app">
  <header class="topbar"><div class="top-inner"><div class="wordmark">QUEST<span>/</span>OS</div></div></header>
  <main class="layout"><section class="panel"><div class="panel-body">
    <div class="eyebrow green">REAL-WORLD RPG</div>
    <h1 style="margin:16px 0">Your world.<br>Your quest.</h1>
    <p id="boot-message" class="muted" style="margin-bottom:24px">Open the playable game to begin.</p>
    <div class="button-row"><a class="btn primary" href="https://questos.mangomint-5316.chatgpt.site/starter/" target="_blank" rel="noopener">Play game</a><a class="btn secondary" href="https://questos.mangomint-5316.chatgpt.site/starter/" target="_blank" rel="noopener">Clean starter</a></div>
    <p class="fine" style="margin-top:20px">If this is a file preview, tap Play game to open it in your browser.</p>
  </div></section></main>
</div>
<dialog class="dialog" id="modal" aria-labelledby="dialog-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div class="drive-screen" id="drive-screen" role="dialog" aria-modal="true" aria-labelledby="drive-title" hidden>
<div><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M3 10h6m6 0h6M10 15l-2 5m6-5 2 5"/></svg><div class="eyebrow" style="margin-top:20px">MISSION PAUSED / CONTROLS LOCKED</div><h1 id="drive-title">Eyes on the road.</h1><p>No calls. No buttons to chase. Your quest can wait.</p><button class="btn primary" data-action="parked">I'm parked - resume quest</button></div>
</div>
<input id="import-file" type="file" accept="application/json,.json" class="file-input" aria-label="Choose a QuestOS JSON file">
<noscript><p style="padding:30px">Use the Play game link above. JavaScript must be enabled in the browser to play.</p></noscript>
<script>(() => { 'use strict';
const launchPanel = document.getElementById('app').innerHTML;
try {
/** Pure, portable game rules. No DOM, network calls, or storage dependencies. */
const VERSION = 1;
const DAY = 86400000;
const MAX_IMPORT_BYTES = 2000000;
const uid = (prefix = 'id') => `${prefix}_${globalThis.crypto?.randomUUID?.() ?? `${Date.now()}_${Math.random().toString(36).slice(2)}`}`;
const clone = value => JSON.parse(JSON.stringify(value));
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const clean = (value, max = 2000) => String(value ?? '').trim().slice(0, max);
function must(condition, message) { if (!condition) throw new Error(message); }
function dayKey(now = Date.now()) {
  const date = new Date(now);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}
function newSkill(name, halfLifeDays = 28, now = Date.now()) {
  return { id: uid('skill'), name: clean(name, 80), xp: 0, readiness: 0, anchorAt: now,
    halfLifeDays: clamp(Number(halfLifeDays) || 28, 1, 365), graceDays: 3, paused: false, sessions: [] };
}
function makeQuest(input = {}, now = Date.now()) {
  const title = clean(input.title, 160);
  must(title.length > 0, 'Give the objective a name.');
  return { id: uid('quest'), title, detail: clean(input.detail),
    nextMove: clean(input.nextMove, 400), destination: clean(input.destination, 240),
    category: ['main', 'side', 'bonus'].includes(input.category) ? input.category : 'main',
    xp: clamp(Math.round(Number.isFinite(Number(input.xp)) && input.xp !== '' && input.xp != null ? Number(input.xp) : 50), 0, 1000),
    status: 'pending', loot: clean(input.loot, 160), createdAt: now, completedAt: null,
    blockedReason: '', verified: false };
}
function makeCampaign(name, subtitle = '', now = Date.now()) {
  return { id: uid('dungeon'), name: clean(name, 100) || 'New dungeon',
    subtitle: clean(subtitle, 160), createdAt: now, quests: [] };
}
function seedCampaign(now) { return makeCampaign('Everyday expedition', 'Your first adventure', now); }
function createPlayer(name = 'Player 1', seeded = false, now = Date.now()) {
  const campaign = seeded ? seedCampaign(now) : makeCampaign('Everyday expedition', 'Turn a real task into an adventure', now);
  return { id: uid('player'), name: clean(name, 60) || 'Player 1', createdAt: now,
    campaigns: [campaign], activeCampaignId: campaign.id,
    skills: [newSkill('Taekwondo', 30, now), newSkill('Strength', 21, now), newSkill('Fieldcraft', 45, now)],
    bonusLoot: [],
    modules: [], events: [], settings: { sound: false, autoCalls: false, callIntervalMinutes: 20, driving: false },
    lastCallAt: now };
}
function createState(now = Date.now()) {
  const player = createPlayer('Player 1', false, now);
  return { kind: 'questos.save', version: VERSION, activePlayerId: player.id, players: [player] };
}
function activePlayer(state) { return state.players.find(p => p.id === state.activePlayerId) || state.players[0]; }
function activeCampaign(player) { return player.campaigns.find(c => c.id === player.activeCampaignId) || player.campaigns[0]; }
function readinessAt(skill, now = Date.now()) {
  if (!skill.xp) return 0;
  if (skill.paused) return clamp(skill.readiness, 0, 100);
  const elapsedDays = Math.max(0, (now - skill.anchorAt) / DAY - skill.graceDays);
  return clamp(skill.readiness * 2 ** (-elapsedDays / skill.halfLifeDays), 0, 100);
}
function potentialLevel(skill) { return skill.xp > 0 ? Math.min(99, 1 + Math.floor(Math.sqrt(skill.xp / 40))) : 0; }
function currentLevel(skill, now = Date.now()) {
  return skill.xp > 0 ? Math.max(1, Math.ceil(potentialLevel(skill) * readinessAt(skill, now) / 100)) : 0;
}
function totalXP(player) {
  return player.campaigns.reduce((sum, c) => sum + c.quests.reduce((n, q) => n + (q.status === 'done' ? q.xp : 0), 0), 0)
    + player.skills.reduce((sum, s) => sum + s.xp, 0);
}
function rankForXP(xp) { return 1 + Math.floor(Math.sqrt(Math.max(0, xp) / 100)); }
function progress(campaign) {
  const main = campaign.quests.filter(q => q.category === 'main');
  const available = main.filter(q => q.status !== 'impossible');
  const done = available.filter(q => q.status === 'done').length;
  return { done, total: available.length, impossible: main.length - available.length,
    complete: available.length > 0 && done === available.length };
}
function nextQuest(campaign) {
  return campaign.quests.find(q => q.category === 'main' && q.status === 'pending')
    || campaign.quests.find(q => q.category === 'side' && q.status === 'pending')
    || campaign.quests.find(q => q.status === 'pending');
}
function inventory(player) {
  return [...player.bonusLoot.map(name => ({ name, source: 'Bonus loot' })), ...player.campaigns.flatMap(c =>
    c.quests.filter(q => q.status === 'done' && q.loot).map(q => ({ name: q.loot, source: c.name })))];
}
function record(player, type, text, now = Date.now(), extra = {}) {
  player.events.unshift({ id: uid('event'), type, text: clean(text, 500), at: now, ...extra });
  player.events = player.events.slice(0, 300);
}
function setQuestStatus(player, questId, status, reason = '', now = Date.now()) {
  must(['pending', 'done', 'impossible'].includes(status), 'Unknown objective status.');
  const quest = player.campaigns.flatMap(c => c.quests).find(q => q.id === questId);
  must(quest, 'Objective not found.');
  if (quest.status === status) return false;
  if (status === 'impossible') must(quest.status !== 'done', 'Undo completion before closing an objective.');
  quest.status = status; quest.completedAt = status === 'done' ? now : null;
  quest.blockedReason = status === 'impossible' ? clean(reason, 500) || 'Closed by the Game Creator. No penalty.' : '';
  record(player, `quest:${status}`, `${status === 'done' ? 'LOOT SECURED' : status === 'impossible' ? 'CLOSED / NO PENALTY' : 'REOPENED'}: ${quest.title}`, now, { questId });
  return true;
}
function practice(player, skillId, note = '', now = Date.now()) {
  const skill = player.skills.find(s => s.id === skillId);
  must(skill, 'Skill not found.');
  must(!skill.paused, 'Resume this skill before logging practice.');
  const key = dayKey(now);
  must(!skill.sessions.some(s => s.day === key), 'Practice already logged today. More sessions do not earn extra XP.');
  const before = readinessAt(skill, now);
  const first = skill.xp === 0;
  const session = { id: uid('practice'), day: key, at: now, note: clean(note, 400), xp: 40,
    before: { xp: skill.xp, readiness: skill.readiness, anchorAt: skill.anchorAt } };
  skill.sessions.push(session);
  skill.xp += 40;
  skill.readiness = first ? 75 : clamp(before + 25, 0, 100);
  skill.anchorAt = now;
  record(player, 'skill:practice', `PRACTICE LOGGED: ${skill.name} (+40 XP)`, now, { skillId, sessionId: session.id });
  return session;
}
function undoPractice(player, skillId, now = Date.now()) {
  const skill = player.skills.find(s => s.id === skillId);
  must(skill?.sessions.length, 'No practice to undo.');
  must(!skill.paused, 'Resume this skill before undoing practice.');
  const session = skill.sessions.pop();
  skill.xp = session.before.xp; skill.readiness = session.before.readiness; skill.anchorAt = session.before.anchorAt;
  record(player, 'skill:undo', `PRACTICE UNDONE: ${skill.name}`, now);
}
function pauseSkill(player, skillId, paused, now = Date.now()) {
  const skill = player.skills.find(s => s.id === skillId);
  must(skill, 'Skill not found.');
  if (skill.paused === paused) return;
  skill.readiness = readinessAt(skill, now); skill.anchorAt = now; skill.paused = paused;
  record(player, 'skill:pause', `${paused ? 'RECOVERY MODE' : 'RESUMED'}: ${skill.name}`, now);
}
function campaignTemplate(campaign) {
  return { kind: 'questos.campaign', version: VERSION, name: campaign.name, subtitle: campaign.subtitle,
    quests: campaign.quests.filter(q => q.status !== 'impossible').map(q => ({ title: q.title, detail: q.detail,
      category: q.category, nextMove: q.nextMove, destination: q.destination, xp: q.xp, loot: q.loot })) };
}
function importCampaign(player, data, now = Date.now()) {
  must(data.kind === 'questos.campaign', 'Expected a QuestOS campaign file.');
  must(Array.isArray(data.quests) && data.quests.length <= 200, 'Campaigns support up to 200 objectives.');
  must(player.campaigns.length < 100, 'This profile already has 100 dungeons.');
  const campaign = makeCampaign(data.name, data.subtitle, now);
  campaign.quests = data.quests.map(q => makeQuest(q, now));
  player.campaigns.push(campaign); player.activeCampaignId = campaign.id;
  record(player, 'campaign:import', `DUNGEON ADDED: ${campaign.name}`, now);
  return campaign;
}
function parseJSON(text) {
  must(typeof text === 'string' && text.length <= MAX_IMPORT_BYTES, 'Import is too large (maximum 2 MB).');
  let data; try { data = JSON.parse(text); } catch { throw new Error('This is not valid JSON.'); }
  must(data && typeof data === 'object' && !Array.isArray(data), 'Expected a JSON object.');
  must(data.version === VERSION, 'Unsupported file version. Expected version 1.');
  return data;
}
function finite(value, low, high, message) {
  must(typeof value === 'number' && Number.isFinite(value) && value >= low && value <= high, message);
  return value;
}
/** Validate imports before replacing any state. Rebuild whitelisted fields; never merge untrusted objects. */
function validateSave(input, now = Date.now()) {
  must(input.kind === 'questos.save' && input.version === VERSION, 'Not a QuestOS v1 save.');
  must(Array.isArray(input.players) && input.players.length >= 1 && input.players.length <= 25, 'Save must contain 1-25 players.');
  const used = new Set();
  const validId = value => {
    must(typeof value === 'string' && /^[A-Za-z0-9_-]{1,100}$/.test(value) && !used.has(value), 'Invalid or duplicate save ID.');
    used.add(value); return value;
  };
  const timestamp = value => finite(value, 0, now + DAY, 'Invalid or future timestamp in save.');
  const players = input.players.map(p => {
    const id = validId(p.id);
    must(Array.isArray(p.campaigns) && p.campaigns.length > 0 && p.campaigns.length <= 100, 'Invalid dungeon list.');
    const campaigns = p.campaigns.map(c => {
      const cid = validId(c.id);
      must(Array.isArray(c.quests) && c.quests.length <= 200, 'Too many objectives.');
      const quests = c.quests.map(q => {
        must(['pending', 'done', 'impossible'].includes(q.status), 'Invalid objective status.');
        return { ...makeQuest(q, now), id: validId(q.id), xp: finite(q.xp, 0, 1000, 'Invalid objective XP.'),
          status: q.status, createdAt: timestamp(q.createdAt), completedAt: q.completedAt == null ? null : timestamp(q.completedAt),
          blockedReason: clean(q.blockedReason, 500), verified: false };
      });
      return { id: cid, name: clean(c.name, 100) || 'Dungeon', subtitle: clean(c.subtitle, 160), createdAt: timestamp(c.createdAt), quests };
    });
    must(Array.isArray(p.skills) && p.skills.length <= 50, 'Invalid skill list.');
    const skills = p.skills.map(s => {
      must(Array.isArray(s.sessions) && s.sessions.length <= 10000, 'Invalid practice log.');
      const days = new Set();
      const sessions = s.sessions.map(t => {
        must(typeof t.day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(t.day) && !days.has(t.day), 'Duplicate or invalid practice date.');
        days.add(t.day);
        return { id: validId(t.id), day: t.day, at: timestamp(t.at), note: clean(t.note, 400), xp: 40,
          before: { xp: finite(t.before?.xp, 0, 1000000, 'Invalid practice history.'), readiness: finite(t.before?.readiness, 0, 100, 'Invalid readiness history.'), anchorAt: timestamp(t.before?.anchorAt) } };
      });
      const xp = finite(s.xp, 0, 1000000, 'Invalid skill XP.');
      must(xp === sessions.length * 40, 'Skill XP does not match the practice log.');
      sessions.forEach((t, index) => must(t.before.xp === index * 40, 'Practice history is out of order.'));
      return { id: validId(s.id), name: clean(s.name, 80), xp, readiness: finite(s.readiness, 0, 100, 'Invalid readiness.'),
        anchorAt: timestamp(s.anchorAt), halfLifeDays: finite(s.halfLifeDays, 1, 365, 'Invalid decay setting.'),
        graceDays: finite(s.graceDays, 0, 30, 'Invalid grace period.'), paused: Boolean(s.paused), sessions };
    });
    const modules = Array.isArray(p.modules) ? p.modules.slice(0, 50).map(m => validateExtension(m)) : [];
    const events = Array.isArray(p.events) ? p.events.slice(0, 300).map(e => ({ id: uid('event'), type: clean(e.type, 60), text: clean(e.text, 500), at: timestamp(e.at) })) : [];
    return { id, name: clean(p.name, 60) || 'Player', createdAt: timestamp(p.createdAt), campaigns,
      activeCampaignId: campaigns.some(c => c.id === p.activeCampaignId) ? p.activeCampaignId : campaigns[0].id,
      skills, bonusLoot: Array.isArray(p.bonusLoot) ? p.bonusLoot.slice(0, 200).map(x => clean(x, 160)) : [],
      modules, events, settings: { sound: Boolean(p.settings?.sound), autoCalls: Boolean(p.settings?.autoCalls),
        callIntervalMinutes: clamp(Number(p.settings?.callIntervalMinutes) || 20, 5, 180), driving: Boolean(p.settings?.driving) },
      lastCallAt: Math.min(Number(p.lastCallAt) || now, now) };
  });
  return { kind: 'questos.save', version: VERSION, players,
    activePlayerId: players.some(p => p.id === input.activePlayerId) ? input.activePlayerId : players[0].id };
}
function validateExtension(input) {
  must(input.kind === 'questos.extension' && input.version === VERSION, 'Expected a QuestOS v1 extension.');
  must(typeof input.id === 'string' && /^[a-z0-9-]{1,80}$/.test(input.id), 'Extension ID must use lowercase letters, digits, or hyphens.');
  const quests = input.quests || []; const skills = input.skills || []; const calls = input.calls || [];
  must(Array.isArray(quests) && quests.length <= 50, 'Extensions support up to 50 objectives.');
  must(Array.isArray(skills) && skills.length <= 10, 'Extensions support up to 10 skills.');
  must(Array.isArray(calls) && calls.length <= 30, 'Extensions support up to 30 operator messages.');
  quests.forEach(q => must(clean(q.title, 160).length, 'An extension objective needs a title.'));
  skills.forEach(s => must(clean(s.name, 80).length, 'An extension skill needs a name.'));
  return { kind: 'questos.extension', version: VERSION, id: input.id, name: clean(input.name, 100) || input.id,
    description: clean(input.description, 400),
    quests: quests.map(q => ({ title: clean(q.title, 160), detail: clean(q.detail), nextMove: clean(q.nextMove, 400),
      category: ['main', 'side', 'bonus'].includes(q.category) ? q.category : 'side', xp: clamp(Number.isFinite(Number(q.xp)) && q.xp != null ? Number(q.xp) : 50, 0, 1000), loot: clean(q.loot, 160), destination: clean(q.destination, 240) })),
    skills: skills.map(s => ({ name: clean(s.name, 80), halfLifeDays: clamp(Number(s.halfLifeDays) || 28, 1, 365) })),
    calls: calls.map(c => ({ caller: clean(c.caller, 80) || 'OPERATOR', text: clean(c.text, 600) })).filter(c => c.text) };
}
function installExtension(player, input, now = Date.now()) {
  const module = validateExtension(input);
  must(!player.modules.some(m => m.id === module.id), 'This extension is already installed.');
  must(player.modules.length < 50, 'Maximum 50 extensions per profile.');
  must(player.skills.length + module.skills.length <= 50, 'Maximum 50 skills per profile.');
  const campaign = activeCampaign(player);
  must(campaign.quests.length + module.quests.length <= 200, 'This dungeon has too many objectives.');
  // Validate the entire module before mutating state.
  const quests = module.quests.map(q => makeQuest(q, now));
  const skills = module.skills.filter(s => !player.skills.some(t => t.name.toLowerCase() === s.name.toLowerCase())).map(s => newSkill(s.name, s.halfLifeDays, now));
  campaign.quests.push(...quests); player.skills.push(...skills); player.modules.push(module);
  record(player, 'module:install', `MODULE INSTALLED: ${module.name}`, now);
  return module;
}
function applyPatch(player, input, now = Date.now()) {
  must(input.kind === 'questos.patch' && input.version === VERSION, 'Expected a QuestOS patch.');
  must(Array.isArray(input.operations) && input.operations.length <= 50, 'A patch supports up to 50 operations.');
  const draft = clone(player);
  for (const op of input.operations) {
    if (op.type === 'addQuest') {
      const c = activeCampaign(draft); must(c.quests.length < 200, 'Too many objectives.');
      c.quests.push(makeQuest(op.quest, now));
    } else if (op.type === 'createCampaign') {
      must(draft.campaigns.length < 100, 'Too many dungeons.');

function render() {
  $('#app').innerHTML = `${header()}<main class="layout">${utility()}${tab==='skills'?skillsPage():tab==='inventory'?inventoryPage():tab==='workshop'?workshopPage():board()}${footer()}</main>`;
  const driving = p().settings.driving;
  $('#drive-screen').hidden = !driving;
  $('#app').inert = driving;
  if (tab==='skills') updateSimulation();
}
function updateSimulation() {
  const days = Number($('#break-days')?.value || 0); const sessions = Number($('#return-sessions')?.value || 0);
  const ready = clamp(100 * 2 ** (-Math.max(0,days-3)/28) + sessions*25,0,100);
  $('#break-value').textContent=days; $('#return-value').textContent=sessions;
  $('#sim-level').textContent=Math.max(1,Math.ceil(8*ready/100)); $('#sim-bar').style.width=`${ready}%`;
  $('#sim-description').textContent=`${Math.round(ready)}% readiness. Potential stays at level 8. ${sessions?'Return sessions rebuild readiness; no extra potential is awarded in this simplified preview.':'Three grace days, then a 28-day readiness half-life.'}`;
}

function importDialog(text = '') {
  previewData=null;
  showModal('Import / review first',`<p class="fine">Accepts a campaign, extension, ChatGPT patch, or full save. Nothing changes until you review and apply.</p><form id="import-form" style="margin-top:18px"><div class="field"><label for="import-json">Paste JSON</label><textarea id="import-json" name="json" class="code" required spellcheck="false" placeholder='{"kind":"questos.patch","version":1,"operations":[]}'>${esc(text)}</textarea></div></form>`,`<button class="btn secondary" data-action="pick-file">Choose file</button><button class="btn primary" type="submit" form="import-form">Review changes</button>`);
}
function previewImport(text) {
  const data=parseJSON(text); let summary=[]; let warning='';
  if (data.kind==='questos.save') {
    validateSave(data); warning='This replaces every local player and all current progress. A recovery export is strongly recommended first.';
    summary=data.players.map(x=>`${x.name}: ${x.campaigns.length} dungeon(s), ${x.skills.length} skill(s)`);
  } else if(data.kind==='questos.campaign') {
    const test=clone(p()); importCampaign(test,data);
    summary=[`New dungeon: ${clean(data.name,100)}`, `${data.quests.length} objectives. All start uncompleted.`,...data.quests.slice(0,10).map(q=>q.title)];
  } else if(data.kind==='questos.extension') {
    const test=clone(p()); const ext=installExtension(test,data);
    summary=[`Install: ${ext.name}`,`${ext.quests.length} objectives, ${ext.skills.length} skills, ${ext.calls.length} call scripts`,...ext.quests.map(q=>q.title)];
  } else if(data.kind==='questos.patch') {
    applyPatch(p(),data);
    summary=data.operations.map(op=> op.type==='addQuest'?`Add objective: ${op.quest.title}`:op.type==='createCampaign'?`Create dungeon: ${op.name}`:op.type==='addSkill'?`Add skill: ${op.name}`:op.type==='setStatus'?`Set ${questById(op.questId)?.title || op.questId}: ${op.status}`:`Install extension: ${op.extension?.name || ''}`);
    warning=data.operations.some(op=>op.type==='setStatus')?'This changes completion status and may change XP. Apply only if it matches what actually happened.':'';
  } else throw new Error('Unsupported import type. Use a QuestOS campaign, extension, patch, or save.');
  previewData=data; previewOrigin=text;
  showModal('Review changes',`<span class="badge">${esc(data.kind.toUpperCase())}</span>${warning?`<div class="warning" style="margin-top:17px">${esc(warning)}</div>`:''}<div class="preview-changes">${summary.map(x=>`<div class="preview-item">${esc(x)}</div>`).join('') || 'No changes.'}</div><p class="fine">Imported text is not verified. No links are opened and no code is executed by importing.</p>`,`<button class="btn secondary" data-action="cancel-import">Back</button>${data.kind==='questos.save'?'<button class="btn secondary" data-action="export-save">Backup current save</button>':''}<button class="btn primary" data-action="apply-import">${data.kind==='questos.save'?'Replace all local saves':'Apply changes'}</button>`);
}
function applyImport() {
  must(previewData,'No import is ready.'); const data=previewData;
  if(data.kind==='questos.save') { state=validateSave(data); storageStatus='local'; recoveryRaw=''; recoveryMessage=''; }
  else if(data.kind==='questos.campaign') { importCampaign(p(),data); tab='board'; }
  else if(data.kind==='questos.extension') installExtension(p(),data);
  else if(data.kind==='questos.patch') { const updated=applyPatch(p(),data); state.players[state.players.findIndex(x=>x.id===p().id)]=updated; }
  previewData=null; closeModal(); commit('Import applied.');
}

  currentCall=operatorMessage(p()); p().lastCallAt=Date.now(); saveState();
  showModal('Incoming transmission',`<div class="call-screen"><div class="eyebrow">SIMULATED IN-GAME CALL / NOT A PHONE CALL</div><div class="call-avatar">${icon('phone',36)}</div><h2>${esc(currentCall.caller)}</h2><p class="fine">A mission update is waiting.</p>${signal(true)}</div>`,`<button class="btn secondary" data-action="decline-call">Decline</button><button class="btn primary" data-action="answer-call">Answer</button>`);

function answerCall() {
  must(currentCall,'No transmission waiting.');
  const text=currentCall.text;
  record(p(),'operator:call',`${currentCall.caller}: ${text}`); saveState();
  showModal('Transmission connected',`<div class="eyebrow green">${esc(currentCall.caller)} / FICTIONAL DISPATCH</div><div class="call-copy">${esc(text)}</div><p class="fine">No new objective is created automatically.</p>`,`<button class="btn primary" data-action="close">End transmission</button>`);
  if(p().settings.sound && 'speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); const utterance=new SpeechSynthesisUtterance(text); utterance.rate=.92; utterance.lang='en-US'; window.speechSynthesis.speak(utterance); } catch { toast('Voice is unavailable in this browser. The message is shown as text.'); }
  }
}
function aboutDialog() {
  showModal('QuestOS / field manual',`<div class="eyebrow green">PLAYABLE PROTOTYPE / v0.1.2</div><p class="detail-text">Complete real objectives to earn XP and collect loot. Create dungeons for trips, errands, work, or practice. Mark a blocked objective impossible to close it without a penalty.</p><h3>Two different records</h3><p class="detail-text">Field rank records completed work. It does not decay. Skill potential records practice. Current skill level falls as readiness decays, and rises as you practice again. This is game logic, not a scientific assessment.</p><h3>Local by design</h3><p class="detail-text">Game data stays in this browser. No analytics, background location, AI request, or real phone call. Your progress is stored in this browser when possible. Export a backup before changing devices or clearing browser data.</p><h3>Reusable and extendable</h3><p class="detail-text">Share campaign templates. Add JSON modules with quests, skills, and operator scripts. The source project contains the rules engine, extension hooks, tests, and static deployment files.</p><h3>ChatGPT integration</h3><p class="detail-text">The bridge is copy/paste. A connected ChatGPT app and shared cloud saves are not implemented in this build. Use the playable game link to open the hosted app. The clean starter has separate local progress. Site access uses ChatGPT sharing settings.</p><h3>Stay grounded</h3><p class="detail-text">Campaigns can contain player-supplied shopping lists and locations. Stock, opening hours, overnight parking rules, church details, and flight times need verification outside this app. No substitutions or automatic completion.</p>`,`<button class="btn primary" data-action="close">Back to the quest</button>`);
}

async function act(action, element) {
  const id=element.dataset.id;
  if(p().settings.driving && action!=='parked') return;
  switch(action) {
    case 'tab': tab=element.dataset.tab; render(); window.scrollTo(0,0); break;
    case 'close': closeModal(); break;
    case 'complete': {
      const q=questById(id); must(q,'Objective not found.');
      const wasComplete=progress(c()).complete;
      const changed=setQuestStatus(p(),id,'done'); if(modal.open) closeModal();
      if(changed) { const newlyComplete=!wasComplete && progress(c()).complete; commit(newlyComplete?`MAIN QUEST COMPLETE. +${q.xp} XP.`:`${q.loot?'Loot secured':'Objective complete'}. +${q.xp} XP.`, 'quest:completed'); }
      break;
    }
    case 'undo-quest': setQuestStatus(p(),id,'pending'); if(modal.open)closeModal(); commit('Objective reopened. Its reward was reversed.'); break;
    case 'detail': detailDialog(id); break;
    case 'new-quest': questForm(); break;
    case 'edit-quest': questForm(id); break;
    case 'close-quest': closeQuestDialog(id); break;
    case 'new-campaign': campaignForm(); break;
    case 'profiles': profileDialog(); break;
    case 'switch-player': must(state.players.some(x=>x.id===id),'Player not found.'); state.activePlayerId=id; tab='board'; closeModal(); commit('Player switched.'); break;
    case 'practice': practiceDialog(id); break;
    case 'new-skill': newSkillDialog(); break;
    case 'skill-detail': skillDetail(id); break;
    case 'pause-skill': {const skill=p().skills.find(s=>s.id===id); must(skill,'Skill not found.'); pauseSkill(p(),id,!skill.paused); commit(skill.paused?'Recovery mode. Readiness is frozen.':'Practice resumed.');break;}
    case 'undo-practice': undoPractice(p(),id); closeModal(); commit('Last practice reversed.'); break;
    case 'copy-starter-link': await copyText(STARTER_URL,'Starter link copied.'); break;
    case 'export-save': download(`questos-save-${dayKey()}.json`,JSON.stringify(state,null,2)); toast('Save exported. Contains all local profiles.'); break;
    case 'share-campaign': {
      const template=campaignTemplate(c());
      showModal('Share a reusable campaign',`<h3>${esc(template.name)}</h3><p class="detail-text">Exports ${template.quests.length} objectives with fresh progress. Does not include players, inventory history, XP, or practice logs.</p><div class="warning">Objective text and map destinations are included. Review them before sharing with colleagues.</div>`,`<button class="btn secondary" data-action="close">Cancel</button><button class="btn primary" data-action="download-template">Export template</button>`); break;
    }
    case 'download-template': download('questos-campaign.json',JSON.stringify(campaignTemplate(c()),null,2));closeModal();toast('Reusable campaign exported.');break;
    case 'import-dialog': importDialog(); break;
    case 'pick-file': $('#import-file').value=''; $('#import-file').click(); break;
    case 'cancel-import': importDialog(previewOrigin); break;
    case 'apply-import': applyImport(); break;
    case 'extension-example': importDialog(JSON.stringify(exampleExtension,null,2)); break;
    case 'agent-brief': briefDialog(); break;
    case 'copy-brief': await copyText($('#agent-brief').value,'Handoff copied. Paste it into ChatGPT.'); break;
    case 'download-brief': download('questos-chatgpt-handoff.txt',$('#agent-brief').value,'text/plain');break;
    case 'call': callDialog(); break;
    case 'answer-call': answerCall(); break;
    case 'decline-call': currentCall=null;closeModal();toast('Transmission declined. No penalty.');break;
    case 'driving': if(modal.open)closeModal();window.speechSynthesis?.cancel();p().settings.driving=true;commit();$('#drive-screen button').focus();break;
    case 'parked': p().settings.driving=false;p().lastCallAt=Date.now();commit('Controls unlocked.');break;
    case 'about': aboutDialog();break;
    case 'add-loot': showModal('Add existing loot',`<form id="loot-form"><div class="field"><label for="loot-name">Item already in your inventory</label><input id="loot-name" name="name" required maxlength="160" placeholder="An item you actually have"></div></form>`,`<button class="btn primary" type="submit" form="loot-form">Add item</button>`);break;
    case 'recovery': recoveryDialog();break;
    case 'export-recovery': download('questos-unreadable-recovery.json',recoveryRaw);break;
    case 'accept-recovery': storageStatus='local';recoveryMessage='';recoveryRaw='';closeModal();commit('Recovered state saved.');break;
  }
}
document.addEventListener('click', event => {
  const target=event.target.closest('[data-action]'); if(!target)return;
  event.preventDefault(); Promise.resolve(act(target.dataset.action,target)).catch(error=>toast(error.message,true));
});
document.addEventListener('submit', event => {
  event.preventDefault(); const form=event.target; const data=Object.fromEntries(new FormData(form));
  if(p().settings.driving) return;
  try {
    if(form.id==='quest-form') {
      const parsed=makeQuest(data); const old=form.dataset.id?questById(form.dataset.id):null;
      if(old) { const oldXP=old.xp;Object.assign(old,{title:parsed.title,detail:parsed.detail,nextMove:parsed.nextMove,destination:parsed.destination,category:parsed.category,xp:parsed.xp,loot:parsed.loot});record(p(),'quest:edit',`OBJECTIVE EDITED: ${old.title}${old.status==='done' && oldXP!==old.xp?' (reward adjusted)':''}`); }
      else { must(c().quests.length<200,'Maximum 200 objectives per dungeon.');c().quests.push(parsed);record(p(),'quest:add',`OBJECTIVE ADDED: ${parsed.title}`); }
      closeModal();commit(old?'Objective updated.':'Objective created.');
    } else if(form.id==='campaign-form') {
      must(p().campaigns.length<100,'Maximum 100 dungeons per player.');const d=makeCampaign(data.name,data.subtitle);p().campaigns.push(d);p().activeCampaignId=d.id;tab='board';record(p(),'campaign:create',`DUNGEON ENTERED: ${d.name}`);closeModal();commit('New dungeon created.');
    } else if(form.id==='player-form') {
      must(state.players.length<25,'Maximum 25 local players.');const player=createPlayer(data.name);state.players.push(player);state.activePlayerId=player.id;tab='board';closeModal();commit('New player ready.');
    } else if(form.id==='practice-form') {
      practice(p(),form.dataset.id,data.note);closeModal();commit('Practice logged. +40 XP.','skill:practiced');
    } else if(form.id==='skill-form') {
      must(p().skills.length<50,'Maximum 50 skills per player.');must(clean(data.name),'Name the skill.');p().skills.push(newSkill(data.name,data.halfLifeDays));closeModal();commit('Skill added.');
    } else if(form.id==='skill-settings-form') {
      const s=p().skills.find(x=>x.id===form.dataset.id);must(s,'Skill not found.');
      s.readiness=readinessAt(s);s.anchorAt=Date.now();s.name=clean(data.name,80);s.halfLifeDays=clamp(Number(data.halfLifeDays),1,365);s.graceDays=clamp(Number(data.graceDays),0,30);closeModal();commit('Skill settings updated.');
    } else if(form.id==='close-quest-form') {setQuestStatus(p(),form.dataset.id,'impossible',data.reason);closeModal();commit('Dead end closed. No penalty.');}
    else if(form.id==='loot-form') {must(p().bonusLoot.length<200,'Maximum 200 bonus items.');p().bonusLoot.push(clean(data.name,160));record(p(),'loot:add',`BONUS LOOT: ${clean(data.name,160)}`);closeModal();commit('Inventory updated.');}
    else if(form.id==='import-form') previewImport(data.json);
  } catch(error) {toast(error.message,true);}
});
document.addEventListener('change', async event => {
  const el=event.target;
  try {
    if(el.id==='campaign-picker'){must(p().campaigns.some(d=>d.id===el.value),'Dungeon not found.');p().activeCampaignId=el.value;commit();}
    else if(el.id==='auto-calls'){p().settings.autoCalls=el.checked;p().lastCallAt=Date.now();commit(el.checked?'Foreground transmissions enabled.':'Automatic transmissions disabled.');}
    else if(el.id==='call-interval'){p().settings.callIntervalMinutes=clamp(Number(el.value),5,180);commit();}
    else if(el.id==='call-sound'){p().settings.sound=el.value==='on';if(!p().settings.sound)window.speechSynthesis?.cancel();commit();}
    else if(el.id==='import-file' && el.files[0]){must(el.files[0].size<=MAX_IMPORT_BYTES,'Maximum import size is 2 MB.');previewImport(await el.files[0].text());}
  } catch(error){toast(error.message,true);}
});
document.addEventListener('input', event => { if(['break-days','return-sessions'].includes(event.target.id))updateSimulation(); });
modal.addEventListener('close',()=>window.speechSynthesis?.cancel());
modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){window.speechSynthesis?.cancel();}else{p().lastCallAt=Date.now();}});
window.addEventListener('storage',event=>{
  if(event.key===KEY && event.newValue){try{state=validateSave(parseJSON(event.newValue));lastSavedRaw=event.newValue;if(modal.open)closeModal();render();toast('Another tab updated this save. Latest state loaded.');}catch{toast('Another tab wrote an unreadable save. Export your current state.',true);}}
});
setInterval(()=>{
  if(!state||document.hidden||modal.open||p().settings.driving)return;
  if(p().settings.autoCalls && Date.now()-p().lastCallAt>=p().settings.callIntervalMinutes*60000)callDialog();
},15000);
// Recompute elapsed-time readiness when viewed; no background process is needed.
setInterval(()=>{if(state&&!document.hidden&&!modal.open&&tab!=='skills'&&!p().settings.driving)render();},60000);
loadState();render();
// Developer extension surface. No untrusted imported JavaScript is evaluated.
window.QuestOS=Object.freeze({version:'0.1.2',on:(event,fn)=>bus.on(event,fn),getSnapshot:()=>clone(state),
  getAgentBrief:()=>agentBrief(p()),previewJSON:text=>previewImport(text)});
if(location.protocol==='http:'||location.protocol==='https:') {
  const link=document.createElement('link');link.rel='manifest';link.href='./manifest.webmanifest';document.head.appendChild(link);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

} catch (error) {
 document.getElementById('app').innerHTML = launchPanel;
 document.getElementById('boot-message').textContent = 'The game could not start here. Open the playable game in your browser.';
 console.error('QuestOS could not start', error);
}
})();</script>
</body>
