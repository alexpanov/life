<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life health check</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05090e;
        color: #e6edf1;
        font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      p {
        margin: 0 0 0.75rem;
        color: #91a5af;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
        color: #b7ca8d;
      }
      a {
        color: #75e2f0;
      }
      dd {
        margin: 0 0 0.75rem;
      }
      dt {
        color: #91a5af;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Life</p>
      <h1>Up</h1>
      <p>This is the health check. The page loaded.</p>
      <dl>
        <dt>Commit</dt>
        <dd id="commit">Waiting</dd>
        <dt>Built</dt>
        <dd id="built">Waiting</dd>
      </dl>
      <p><a href="../">Open the app</a></p>
    </main>
    <script>
      fetch("../build-info.json", { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) throw new Error("missing");
          return response.json();
        })
        .then(function (info) {
          document.getElementById("commit").textContent = info.commit || "Unknown";
          document.getElementById("built").textContent = info.builtAt || "Unknown";
        })
        .catch(function () {
          document.getElementById("commit").textContent = "Not published";
          document.getElementById("built").textContent = "Not published";
        });
    </script>
  </body>
</html>
